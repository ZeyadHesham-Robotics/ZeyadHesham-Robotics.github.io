{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MCV Vision</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card bg-dark border-secondary" style="width: 380px;">
        <div class="card-header border-secondary text-center">
            <h4 class="text-orange mb-0"><i class="bi bi-gear-wide-connected"></i> MCV Vision</h4>
            <small class="text-muted">Fiber Milling Calibration System</small>
        </div>
        <div class="card-body p-4">
            <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label small text-muted">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-darker border-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" id="login-username" class="form-control bg-darker" placeholder="Enter username" autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-darker border-secondary"><i class="bi bi-lock"></i></span>
                        <input type="password" id="login-password" class="form-control bg-darker" placeholder="Enter password">
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-success" id="btn-login">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                    </button>
                </div>
            </form>
        </div>
        <div class="card-footer border-secondary text-center">
            <small class="text-muted">Contact admin for account access</small>
        </div>
    </div>

    <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        const errorDiv = document.getElementById('login-error');
        const btn = document.getElementById('btn-login');

        if (!username || !password) {
            errorDiv.textContent = 'Please enter both username and password.';
            errorDiv.classList.remove('d-none');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Signing in...';

        fetch('/api/auth/login/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                window.location.href = '/';
            } else {
                errorDiv.textContent = data.message || 'Invalid credentials';
                errorDiv.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
            }
        })
        .catch(() => {
            errorDiv.textContent = 'Connection error. Please try again.';
            errorDiv.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
        });
    });
    </script>
</body>
</html>
